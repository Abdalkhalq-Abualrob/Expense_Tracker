<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
      <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1">Expense Tracker</span>
        <!--Button to switch between light and dark mode-->
        <button id="theme-toggle" class="btn btn-outline-light btn-sm">
          🌙 Dark Mode
        </button>
      </div>
    </nav>

    <div class="container my-4">
      <!-- Statistics Cards Using CSS Grid -->
      <div class="summary-cards-grid mb-4">
        <div class="card text-white bg-primary shadow-sm border-0 h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h6 class="card-title text-uppercase text-white-50 small mb-1">
              Total Expenses
            </h6>
            <h3 class="card-text fw-bold mb-0" id="total-amount">$0.00</h3>
          </div>
        </div>

        <div class="card text-white bg-secondary shadow-sm border-0 h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h6 class="card-title text-uppercase text-white-50 small mb-1">
              Total Count
            </h6>
            <h3 class="card-text fw-bold mb-0" id="total-count">0</h3>
          </div>
        </div>

        <div class="card text-white bg-success shadow-sm border-0 h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h6 class="card-title text-uppercase text-white-50 small mb-1">
              Highest Expense
            </h6>
            <h3 class="card-text fw-bold mb-0" id="highest-expense">$0.00</h3>
          </div>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <!-- Add New Expense Form -->
        <div class="col-12 col-lg-7">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-body py-3">
              <h5 class="card-title mb-0 fw-bold">Add New Expense</h5>
            </div>
            <div class="card-body">
              <form id="expense-form" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="title" class="form-label">Title</label>
                    <input
                      type="text"
                      class="form-control"
                      id="title"
                      placeholder="e.g., Grocery"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="amount" class="form-label">Amount ($)</label>
                    <input
                      type="number"
                      step="0.01"
                      min="0.01"
                      class="form-control"
                      id="amount"
                      placeholder="0.00"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="category" class="form-label">Category</label>
                    <select class="form-select" id="category" required>
                      <option value="" selected disabled>
                        Select Category
                      </option>
                      <option value="Food">Food</option>
                      <option value="Transport">Transport</option>
                      <option value="Bills">Bills</option>
                      <option value="Entertainment">Entertainment</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="date" class="form-label">Date</label>
                    <input
                      type="date"
                      class="form-control"
                      id="date"
                      required
                    />
                  </div>
                  <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary w-100">
                      Add Expense
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!--Chart.js for expense breakdown-->
        <div class="col-12 col-lg-5">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-body py-3">
              <h5 class="card-title mb-0 fw-bold">Expense Breakdown</h5>
            </div>
            <div
              class="card-body d-flex justify-content-center align-items-center"
              style="position: relative; min-height: 250px"
            >
              <canvas id="expense-chart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading-spinner and Alert Elements -->
      <div id="loading-spinner" class="text-center my-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div id="alert-box" class="alert alert-danger d-none" role="alert"></div>

      <!-- Expenses Table with Filter Option -->
      <div class="card shadow-sm border-0">
        <div
          class="card-header bg-body py-3 d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <h5 class="card-title mb-0 fw-bold">Recent Expenses</h5>
          <div class="d-flex align-items-center gap-2">
            <label
              for="filter-category"
              class="form-label mb-0 fw-semibold text-muted text-nowrap"
              >Filter:</label
            >
            <select
              id="filter-category"
              class="form-select form-select-sm"
              style="min-width: 140px"
            >
              <option value="All">All Categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table
              class="table table-hover align-middle mb-0 custom-expense-table text-nowrap"
            >
              <thead class="table-light">
                <tr>
                  <th scope="col" class="ps-3">#</th>
                  <th scope="col">Title</th>
                  <th scope="col">Amount</th>
                  <th scope="col">Category</th>
                  <th scope="col">Date</th>
                  <th scope="col" class="text-end pe-3">Actions</th>
                </tr>
              </thead>
              <tbody id="expenses-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Edit Expense Modal -->
      <div
        class="modal fade"
        id="editModal"
        tabindex="-1"
        aria-labelledby="editModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="editModalLabel">
                Edit Expense
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <form id="edit-form">
              <div class="modal-body">
                <input type="hidden" id="edit-id" />
                <div class="mb-3">
                  <label for="edit-title" class="form-label">Title</label>
                  <input
                    type="text"
                    class="form-control"
                    id="edit-title"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="edit-amount" class="form-label">Amount ($)</label>
                  <input
                    type="number"
                    step="0.01"
                    min="0.01"
                    class="form-control"
                    id="edit-amount"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="edit-category" class="form-label">Category</label>
                  <select class="form-select" id="edit-category" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="edit-date" class="form-label">Date</label>
                  <input
                    type="date"
                    class="form-control"
                    id="edit-date"
                    required
                  />
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                  Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="index.js"></script>
  </body>
</html>
